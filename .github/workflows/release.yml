name: Release

# Builds the binaries for each platform and attaches them to a published release.
# Pull requests that change this file build without uploading.
on:
  release:
    types: [published]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, exe: agentlens.exe }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, exe: agentlens }
          - { target: aarch64-apple-darwin, os: macos-latest, exe: agentlens }
          - { target: x86_64-apple-darwin, os: macos-latest, exe: agentlens }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable && rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=agentlens-${{ github.event.release.tag_name || 'dev' }}-${{ matrix.target }}
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            7z a "$name.zip" "$name" >/dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ASSET" --clobber
