[package]
name = "agentlens-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Process model behind agentlens: groups coding-agent processes by host, tab and session, and finds what ended sessions left behind"
license = "MIT"
repository = "https://github.com/IceMan0224/agentlens"

[dependencies]
base64 = "0.22.1"
netstat2 = "0.11.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
toml = "1.1.8"

[target.'cfg(windows)'.dependencies]
sysinfo = "0.40.0"
windows = { version = "0.62", features = [
    "Wdk_System_SystemInformation",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.7.0"

