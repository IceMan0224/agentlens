# Everything agentlens knows about processes, kept out of the code. The user's rules.toml
# uses the same tables and extends these: list entries are added, and an agent or host with
# an existing id gains the rule's entries.
#
# Names (exe, shells, ...) are matched case-insensitively against the process name without
# `.exe`. Paths and command-line fragments are matched as lowercase substrings with `/`
# separators.

[processes]
shells = [
    "powershell", "pwsh", "cmd", "bash", "sh", "zsh", "fish", "nu", "dash", "ksh", "tcsh", "csh",
    "wsl", "wslhost", "conhost", "openconsole", "winpty-agent",
]
# Interpreters: agents may run as scripts under them, and their orphans are worth showing.
runtimes = ["node", "bun", "deno", "python", "pythonw", "uv", "uvx", "npx"]
# Pseudo-console glue that lives and dies with its client: not shown, never reported alone.
pty_glue = ["conhost", "openconsole", "winpty-agent"]
# Never grouped, never killed.
system = [
    # Windows
    "system idle process", "system", "registry", "smss", "csrss", "wininit", "winlogon", "services",
    "lsass", "svchost", "explorer", "dwm", "fontdrvhost", "sihost", "ctfmon", "taskhostw",
    "runtimebroker", "userinit",
    # macOS and Linux
    "kernel_task", "launchd", "systemd", "init", "kthreadd", "windowserver", "loginwindow",
]
# Adopt orphans on Unix: a process whose parent exits is re-parented to one of these.
reapers = ["launchd", "systemd", "init"]
# Executables under these never are agents, even when a name collides with a short command.
system_dirs = ["c:/windows/", "/system/", "/usr/libexec/", "/usr/sbin/", "/sbin/"]
browsers = ["chrome", "msedge", "chromium", "headless_shell", "chrome-headless-shell"]
# Helper kinds under an agent: REPL by exact name, sandbox by name substring, MCP server by a
# whole word of its command line.
repl = ["node_repl"]
sandbox = ["sandbox"]
mcp = ["mcp", "modelcontextprotocol"]
# Command-line flags (or subcommands) followed by a session id; `--flag=id` works too.
session_flags = ["--resume", "-r", "--session", "--session-id", "resume"]

[ssh]
clients = ["ssh", "plink", "putty", "sftp", "scp"]
# Inbound logins; newer OpenSSH (and macOS) hand each one to an `sshd-session` process.
servers = ["sshd", "sshd-session"]
# Ports from ~/.ssh/config are added to these.
ports = [22]

[providers]
# Environment variables that point an agent at another model endpoint.
env = ["ANTHROPIC_BASE_URL", "OPENAI_BASE_URL"]
# Endpoints of the agents' own vendors: not shown as a provider.
first_party = ["anthropic.com", "openai.com"]

[[providers.known]]
name = "GLM"
url = ["z.ai", "bigmodel"]
cmd = ["glm-", "zai/", "zhipu"]

[[providers.known]]
name = "Kimi"
url = ["moonshot"]

[[providers.known]]
name = "DeepSeek"
url = ["deepseek"]

[[providers.known]]
name = "Qwen"
url = ["dashscope"]

[[providers.known]]
name = "OpenRouter"
url = ["openrouter"]

# Agents: Orca's catalog of 45. `exe` lists command names; `cmd` lists package paths seen when
