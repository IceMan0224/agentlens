# Hosts: programs whose children are agent sessions. `path` matches the executable path.
# `tab_env` names an environment variable the host sets per tab (sessions sharing a value
# share a tab), `label_env` one whose value labels the tab (a `<id>::<path>` value is shown
# by its path), `launch_env` one set on everything an agent launched, and `traces` paths in
# the command lines of the host's agent tooling.

[[hosts]]
id = "orca"
name = "Orca"
exe = ["orca"]
path = ["/orca.app/"]
tab_env = "ORCA_TAB_ID"
label_env = "ORCA_WORKTREE_ID"
launch_env = "ORCA_AGENT_LAUNCH"
traces = ["/orca/agent-hooks/"]

[[hosts]]
id = "claude-desktop"
